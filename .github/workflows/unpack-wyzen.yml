name: Unpack WYZEN ZIP

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          test -f wyzen-social-complete.zip
          mkdir -p /tmp/wyzen
          unzip -q wyzen-social-complete.zip -d /tmp/wyzen
          ROOT="$(find /tmp/wyzen -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          rsync -a --exclude='.git' --exclude='README.md' "$ROOT/" ./
          rm wyzen-social-complete.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract WYZEN SOCIAL project ZIP" || echo "No changes"
          git push
