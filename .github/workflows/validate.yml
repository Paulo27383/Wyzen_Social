name: Validate WYZEN

on:
  push:
    branches: [main, feat/android-wake-word-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependencies
        run: npx expo install --check
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo project diagnostics
        run: npx expo-doctor
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q server/app


  build-apk:
    name: Build Android APK after validation
    needs: [android, server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/android-wake-word-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configura o secret EXPO_TOKEN nas definições do repositório GitHub."
            exit 1
          fi
      - name: Build preview APK with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
