name: Build WYZEN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-wake-word-foundation
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'modules/**'
      - 'plugins/**'
      - 'src/**'
      - '.github/workflows/build-android-apk.yml'

concurrency:
  group: wyzen-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android native build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Download and verify Sherpa ONNX Android AAR
        run: |
          mkdir -p modules/wyzen-wake-word/android/libs
          curl --fail --location --retry 3 --output modules/wyzen-wake-word/android/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  modules/wyzen-wake-word/android/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check

      - name: Generate Android launcher PNG
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wyzen-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
