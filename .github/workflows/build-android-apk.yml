name: Build Wyzen Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wyzen-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK with Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Download bundled Qwen GGUF model
        run: |
          mkdir -p assets
          curl --fail --location --retry 5 --retry-all-errors --output assets/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
          test "$(stat -c%s assets/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf)" -gt 300000000

      - name: Generate Android launcher PNG
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WYZEN-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
