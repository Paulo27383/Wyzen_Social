name: Build Wyzen Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wyzen-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Android launcher PNG
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024

      - name: Build Android APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
