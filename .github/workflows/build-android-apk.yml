name: Build WYZEN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-wake-word-foundation
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'modules/**'
      - 'plugins/**'
      - 'src/**'
      - '.github/workflows/build-android-apk.yml'

concurrency:
  group: wyzen-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android native build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck

      - name: Generate Android launcher PNG
        run: npx --yes sharp-cli -i assets/icon.svg -o assets/icon.png resize 1024 1024

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone release APK (includes JavaScript bundle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK and embedded JavaScript bundle
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: wyzen-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
