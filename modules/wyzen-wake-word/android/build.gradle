def safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }

group = 'com.wyzen.ai.wakeword'
version = '1.0.0'

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.wyzen.ai.wakeword"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig { minSdkVersion safeExtGet("minSdkVersion", 24) }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  // The official Android AAR is downloaded and checksum-verified by the APK workflow.
  // Using the standalone AAR avoids JitPack's aggregate POM and duplicate JVM classes.
  implementation files('libs/sherpa-onnx-2.0.1.aar')
  implementation 'org.apache.commons:commons-compress:1.27.1'
}
