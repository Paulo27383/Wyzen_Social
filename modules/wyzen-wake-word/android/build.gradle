def safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }

group = 'com.wyzen.ai.wakeword'
version = '1.0.0'

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.wyzen.ai.wakeword"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig { minSdkVersion safeExtGet("minSdkVersion", 24) }
}

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation project(':expo-modules-core')
  // Use the Android AAR directly. The aggregate Maven POM also pulls sherpa-onnx-jvm,
  // whose classes duplicate those already packaged in the Android AAR.
  implementation 'com.github.k2-fsa:sherpa-onnx:v2.0.1@aar'
  implementation 'org.apache.commons:commons-compress:1.27.1'
}
